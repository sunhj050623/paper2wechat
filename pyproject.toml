[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2wechat"
version = "0.1.0"
description = "Turn academic papers into source-grounded Chinese WeChat drafts."
requires-python = ">=3.10"
dependencies = [
  "markdown>=3.5",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
